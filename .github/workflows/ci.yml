name: Harness CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicitly select the normal harness or one bounded metadata operation
        type: choice
        required: true
        default: normal
        options:
          - normal
          - metadata-calibration
          - metadata-diagnostic
permissions:
  contents: read
concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  LAB_LINK_RUNTIME: 'enabled'
jobs:
  unit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'normal' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Synthetic private-notice sealing and recovery controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/unit .cache/m2
          caller_status=0
          python3 scripts/test-linked-caller.py 2>&1 | tee .cache/unit/linked-caller-controls.log || caller_status=$?
          caller_reports=(.cache/m2/linked-caller-controls/run-*/report.json)
          test "${#caller_reports[@]}" -eq 1
          cp "${caller_reports[0]}" .cache/unit/linked-caller-observations.json
          test "$caller_status" -eq 0
          python3 scripts/test-link-notice-sealing.py 2>&1 | tee .cache/unit/notice-controls.log
          python3 - <<'PYOBS'
          import hashlib, json, math, os, re, stat
          from pathlib import Path
          root = Path(".cache/m2/notice-sealing-implementation")
          directory = root.lstat()
          assert stat.S_ISDIR(directory.st_mode) and stat.S_IMODE(directory.st_mode) == 0o700 and directory.st_uid == os.getuid()
          reports = list(root.glob("run-*-report.json"))
          assert len(reports) == 1
          info = reports[0].lstat()
          assert stat.S_ISREG(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o600 and info.st_uid == os.getuid()
          assert info.st_nlink == 1 and 0 < info.st_size <= 1048576
          report = json.loads(reports[0].read_bytes())
          assert report["status"] == "passed"
          assert report["environment"]["os"] == "Linux" and report["environment"]["machine"] == "x86_64"
          assert re.fullmatch(r"[0-9.]{3,20}", report["environment"]["python"])
          sources = ["test-link-notice-sealing.py", "seal-link-notices.py", "unseal-link-notices.py",
                     "retrieve-link-notices.py", "create-notice-transport-sample.py", "link-notices-recipient.pem"]
          assert set(report["source_sha256"]) == set(sources)
          for name in sources:
              assert report["source_sha256"][name] == hashlib.sha256((Path("scripts") / name).read_bytes()).hexdigest()
          controls = report["controls"]
          assert 6 <= len(controls) <= 256 and all(row["passed"] is True for row in controls)
          specs = {}
          for name in ["producer-empty-acceptance", "consumer-empty-acceptance", "producer-partial-acceptance"]:
              specs["actual CLI early stdin zero-exit " + name] = {"accepted_bytes", "intended_bytes", "kills", "waits", "write_attempts", "real_pipe_EPIPE", "synthetic_child"}
          for name in ["producer-setup-error", "consumer-interrupt"]:
              specs["actual CLI open stdin bounded cleanup " + name] = {"all_streams_closed", "child_reaped", "elapsed_seconds", "kills", "no_new_path_after_failure", "synthetic_child", "wait_timeout_seconds", "waits", "writer_joined"}
          small = "native small-pipe valid recovery stdout fully drained and writer joined"
          specs[small] = {"synthetic_child", "actual_pipe_capacity", "stdout_bytes", "writer_joined"}
          selected = []
          for name, fields in specs.items():
              matches = [row for row in controls if row["case"] == name]
              assert len(matches) == 1
              row = matches[0]
              assert set(row) == fields | {"case", "passed"}
              flags = {"real_pipe_EPIPE", "synthetic_child", "all_streams_closed", "child_reaped",
                       "no_new_path_after_failure", "writer_joined"}
              for key in fields:
                  if key in flags:
                      assert type(row[key]) is bool
                  elif key == "elapsed_seconds":
                      assert type(row[key]) in (int, float) and math.isfinite(row[key]) and row[key] >= 0
                  else:
                      assert type(row[key]) is int and row[key] >= 0
              assert row["synthetic_child"] is True
              selected.append(row)
          pipe = next(row for row in selected if row["case"] == small)
          assert type(pipe["actual_pipe_capacity"]) is int and 0 < pipe["actual_pipe_capacity"] <= 8192
          assert pipe["stdout_bytes"] == 10240 and pipe["writer_joined"] is True
          head = os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", head)
          output = {"namespace": "calibration/private-notice-controls", "release_qualified": False,
                    "source_head": head, "source_sha256": report["source_sha256"],
                    "environment": {key: report["environment"][key] for key in ("os", "machine", "python")},
                    "controls_passed": len(controls),
                    "selected_numeric_controls": selected,
                    "scope": "Fixed reviewed synthetic controls only; no private diagnostics, keys or raw notices."}
          with Path(".cache/unit/notice-observations.json").open("x") as stream:
              json.dump(output, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PYOBS
      - name: Synthetic retained storage-helper and encrypted-upload admission controls
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/unit .cache/m2
          storage_status=0
          python3 scripts/test-link-notice-storage.py 2>&1 | tee .cache/unit/private-storage-controls.log || storage_status=$?
          storage_reports=(.cache/m2/private-notice-storage-controls/run-*/public-report.json)
          test "${#storage_reports[@]}" -eq 1
          cp "${storage_reports[0]}" .cache/unit/private-storage-observations.json
          test "$storage_status" -eq 0
          caller_status=0
          python3 scripts/test-encrypted-notice-upload.py 2>&1 | tee .cache/unit/encrypted-upload-controls.log || caller_status=$?
          caller_reports=(.cache/m2/encrypted-notice-upload-controls/run-*/public-report.json)
          test "${#caller_reports[@]}" -eq 1
          cp "${caller_reports[0]}" .cache/unit/encrypted-upload-observations.json
          test "$caller_status" -eq 0
      - name: Synthetic metadata caller controls
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/unit
          python3 scripts/test-capture-metadata.py > .cache/unit/metadata-caller-controls.log 2>&1
          python3 scripts/test-admit-metadata.py > .cache/unit/metadata-admission-controls.log 2>&1
      - name: Format, vet, and unit controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/unit
          ./scripts/check.sh 2>&1 | tee .cache/unit/check.log
      - name: Create reviewed fixed synthetic transport sample
        id: reviewed-notice-sample
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/resilience-release-lab' && env.LAB_LINK_RUNTIME != 'enabled' }}
        shell: bash
        env:
          SAMPLE_RUN_ID: transport-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_JOB" = unit
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/create-notice-transport-sample.py --run-id "$SAMPLE_RUN_ID" --source-head "$GITHUB_SHA" --job "$GITHUB_JOB" --attempt "$GITHUB_RUN_ATTEMPT" --reviewed-synthetic-transport-only
          printf 'complete=true\n' >> "$GITHUB_OUTPUT"
      - name: Upload only reviewed synthetic transport ciphertext
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/resilience-release-lab' && env.LAB_LINK_RUNTIME != 'enabled' && steps.reviewed-notice-sample.outputs.complete == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 2
        with:
          name: encrypted-link-notices-unit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/link-quarantine/transport-${{ github.run_id }}-${{ github.run_attempt }}/notice.cms
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/unit/
          retention-days: 14
          if-no-files-found: error
  metadata:
    # This explicit mode never starts the normal jobs or the release verifier.
    # Select the diagnostic only after exact-head native calibration and reviewed
    # authenticated Mac recovery; a dispatch itself is not recovery evidence.
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'pagrus7/kaferry-lab' && github.repository_id == '1432555755' && github.ref == 'refs/heads/codex/resilience-release-lab' && (inputs.mode == 'metadata-calibration' || inputs.mode == 'metadata-diagnostic') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LAB_RUN_ID: metadata-${{ github.run_id }}-${{ github.run_attempt }}
      METADATA_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build the sole fixed metadata producer in a fresh private directory
        id: metadata-build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_JOB" = metadata
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = pagrus7/kaferry-lab
          test "$GITHUB_REPOSITORY_ID" = 1432555755
          test "$GITHUB_REF" = refs/heads/codex/resilience-release-lab
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -sm)" = 'Linux x86_64'
          mkdir -p .cache/metadata-build .cache/metadata-foreground-private
          mkdir -m 700 ".cache/metadata-build/$LAB_RUN_ID"
          mkdir -m 700 ".cache/metadata-foreground-private/$LAB_RUN_ID"
          go build -o ".cache/metadata-build/$LAB_RUN_ID/metadata-capture" ./cmd/metadata-capture
          chmod 700 ".cache/metadata-build/$LAB_RUN_ID/metadata-capture"
          binary_sha256="$(sha256sum ".cache/metadata-build/$LAB_RUN_ID/metadata-capture" | cut -d ' ' -f 1)"
          printf 'binary_sha256=%s\n' "$binary_sha256" >> "$GITHUB_OUTPUT"
      - name: Calibrate synthetic producer, caller and actual native cleanup
        id: metadata-controls
        if: ${{ inputs.mode == 'metadata-calibration' }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          set -C
          umask 077
          mkdir -m 700 .cache/metadata-public
          go test -v -count=1 -timeout=2m ./cmd/metadata-capture > .cache/metadata-public/producer-controls.log 2>&1
          python3 scripts/test-capture-metadata.py > .cache/metadata-public/caller-controls.log 2>&1
          python3 scripts/test-admit-metadata.py > .cache/metadata-public/metadata-admission-controls.log 2>&1
          python3 scripts/calibrate-metadata.py --run-id "$LAB_RUN_ID" --source-head "$GITHUB_SHA" --attempt "$GITHUB_RUN_ATTEMPT" > ".cache/metadata-foreground-private/$LAB_RUN_ID/calibration.stdout" 2> ".cache/metadata-foreground-private/$LAB_RUN_ID/calibration.stderr"
          test -s .cache/metadata-public/native-controls.json
          printf 'complete=true\n' >> "$GITHUB_OUTPUT"
      - name: Run the sole metadata caller in the foreground
        id: metadata-foreground
        if: ${{ inputs.mode == 'metadata-diagnostic' || (inputs.mode == 'metadata-calibration' && steps.metadata-controls.outcome == 'success' && steps.metadata-controls.outputs.complete == 'true') }}
        timeout-minutes: 2
        shell: bash
        env:
          BINARY_SHA256: ${{ steps.metadata-build.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          set -C
          umask 077
          status=0
          if [ "$METADATA_MODE" = metadata-calibration ]; then
            # Exercise the actual producer CLI and complete transport path with
            # a setup ENOENT before client.Do; never query the provider here.
            trust_file="$PWD/.cache/metadata-build/$LAB_RUN_ID/calibration-trust-file-must-be-absent.pem"
            test ! -e "$trust_file"
            test ! -L "$trust_file"
            SSL_CERT_FILE="$trust_file" python3 scripts/capture-metadata.py --run-id "$LAB_RUN_ID" --source-head "$GITHUB_SHA" --job metadata --attempt "$GITHUB_RUN_ATTEMPT" --binary-sha256 "$BINARY_SHA256" > ".cache/metadata-foreground-private/$LAB_RUN_ID/stdout.json" 2> ".cache/metadata-foreground-private/$LAB_RUN_ID/stderr.bin" || status=$?
          else
            test "$METADATA_MODE" = metadata-diagnostic
            python3 scripts/capture-metadata.py --run-id "$LAB_RUN_ID" --source-head "$GITHUB_SHA" --job metadata --attempt "$GITHUB_RUN_ATTEMPT" --binary-sha256 "$BINARY_SHA256" > ".cache/metadata-foreground-private/$LAB_RUN_ID/stdout.json" 2> ".cache/metadata-foreground-private/$LAB_RUN_ID/stderr.bin" || status=$?
          fi
          printf '%s\n' "$status" > ".cache/metadata-foreground-private/$LAB_RUN_ID/foreground.exit"
          test "$status" -eq 0 -o "$status" -eq 2
          printf 'foreground_exit=%s\n' "$status" >> "$GITHUB_OUTPUT"
      - name: Independently admit actual foreground and finite writer closure
        id: metadata-proof
        if: ${{ steps.metadata-foreground.outcome == 'success' }}
        shell: bash
        env:
          BINARY_SHA256: ${{ steps.metadata-build.outputs.binary_sha256 }}
          FOREGROUND_EXIT: ${{ steps.metadata-foreground.outputs.foreground_exit }}
        run: |
          set -euo pipefail
          set -C
          umask 077
          calibration_args=()
          if [ "$METADATA_MODE" = metadata-calibration ]; then
            calibration_args+=(--calibration)
          fi
          python3 scripts/admit-metadata.py --run-id "$LAB_RUN_ID" --source-head "$GITHUB_SHA" --attempt "$GITHUB_RUN_ATTEMPT" --binary-sha256 "$BINARY_SHA256" --foreground-exit "$FOREGROUND_EXIT" "${calibration_args[@]}" > ".cache/metadata-foreground-private/$LAB_RUN_ID/admit.stdout" 2> ".cache/metadata-foreground-private/$LAB_RUN_ID/admit.stderr"
      - name: Seal only the independently admitted closed fixture-v1 snapshot
        id: metadata-seal
        if: ${{ steps.metadata-proof.outcome == 'success' && steps.metadata-proof.outputs.complete == 'true' && steps.metadata-proof.outputs.snapshot_admissible == 'true' }}
        shell: bash
        env:
          BINARY_SHA256: ${{ steps.metadata-build.outputs.binary_sha256 }}
          FOREGROUND_EXIT: ${{ steps.metadata-foreground.outputs.foreground_exit }}
        run: |
          set -euo pipefail
          set -C
          umask 077
          calibration_args=()
          if [ "$METADATA_MODE" = metadata-calibration ]; then
            calibration_args+=(--calibration)
          fi
          python3 scripts/seal-link-notices.py --run-id "$LAB_RUN_ID" --source-head "$GITHUB_SHA" --recipient-sha256 ce023413c3cb69ca45f71d23a4fb6e6a5cabcea1b2feb4ae54f1e5452c74af57 --job metadata --attempt "$GITHUB_RUN_ATTEMPT" > ".cache/metadata-foreground-private/$LAB_RUN_ID/seal.stdout" 2> ".cache/metadata-foreground-private/$LAB_RUN_ID/seal.stderr"
          python3 scripts/admit-metadata.py --run-id "$LAB_RUN_ID" --source-head "$GITHUB_SHA" --attempt "$GITHUB_RUN_ATTEMPT" --binary-sha256 "$BINARY_SHA256" --foreground-exit "$FOREGROUND_EXIT" --sealed "${calibration_args[@]}" > ".cache/metadata-foreground-private/$LAB_RUN_ID/sealed-admit.stdout" 2> ".cache/metadata-foreground-private/$LAB_RUN_ID/sealed-admit.stderr"
      - name: Upload only the sole admitted metadata ciphertext
        id: metadata-upload
        if: ${{ steps.metadata-foreground.outcome == 'success' && steps.metadata-proof.outcome == 'success' && steps.metadata-proof.outputs.complete == 'true' && steps.metadata-proof.outputs.snapshot_admissible == 'true' && steps.metadata-seal.outcome == 'success' && steps.metadata-seal.outputs.complete == 'true' && steps.metadata-seal.outputs.snapshot_admissible == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 2
        with:
          name: encrypted-link-notices-metadata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/link-quarantine/${{ env.LAB_RUN_ID }}/notice.cms
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
      - name: Upload only selected synthetic calibration facts
        if: ${{ !cancelled() && inputs.mode == 'metadata-calibration' && steps.metadata-controls.outcome == 'success' && steps.metadata-controls.outputs.complete == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 1
        with:
          name: metadata-calibration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/metadata-public/native-controls.json
            .cache/metadata-public/producer-controls.log
            .cache/metadata-public/caller-controls.log
            .cache/metadata-public/metadata-admission-controls.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Keep missing or incomplete metadata evidence nonpassing after retention
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.metadata-build.outcome }}
          CONTROLS_OUTCOME: ${{ steps.metadata-controls.outcome }}
          CONTROLS_COMPLETE: ${{ steps.metadata-controls.outputs.complete }}
          FOREGROUND_OUTCOME: ${{ steps.metadata-foreground.outcome }}
          FOREGROUND_EXIT: ${{ steps.metadata-foreground.outputs.foreground_exit }}
          PROOF_OUTCOME: ${{ steps.metadata-proof.outcome }}
          PROOF_COMPLETE: ${{ steps.metadata-proof.outputs.complete }}
          CAPTURE_COMPLETE: ${{ steps.metadata-proof.outputs.capture_complete }}
          SEAL_OUTCOME: ${{ steps.metadata-seal.outcome }}
          SEALED: ${{ steps.metadata-seal.outputs.complete }}
          UPLOAD_OUTCOME: ${{ steps.metadata-upload.outcome }}
        run: |
          set -euo pipefail
          test "$BUILD_OUTCOME" = success
          test "$FOREGROUND_OUTCOME" = success
          test "$PROOF_OUTCOME" = success
          test "$PROOF_COMPLETE" = true
          test "$SEAL_OUTCOME" = success
          test "$SEALED" = true
          test "$UPLOAD_OUTCOME" = success
          if [ "$METADATA_MODE" = metadata-calibration ]; then
            test "$CONTROLS_OUTCOME" = success
            test "$CONTROLS_COMPLETE" = true
            test "$FOREGROUND_EXIT" = 2
            test "$CAPTURE_COMPLETE" = false
            test -s .cache/metadata-public/native-controls.json
          else
            test "$METADATA_MODE" = metadata-diagnostic
            test "$FOREGROUND_EXIT" = 0
            test "$CAPTURE_COMPLETE" = true
          fi
  m1:
    # Published-artifact verification resumes only on this trusted ordinary push.
    if: ${{ github.repository == 'pagrus7/kaferry-lab' && github.repository_id == '1432555755' && github.event_name == 'push' && github.ref == 'refs/heads/codex/resilience-release-lab' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOCOVERDIR: ${{ github.workspace }}/.cache/m1/coverage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build the lab on native Linux AMD64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/bin .cache/m1/coverage
          {
            uname -sm
            test "$(uname -sm)" = "Linux x86_64"
            go version
            gh --version
            go build -cover -coverpkg=./... -o .cache/bin/lab ./cmd/lab
          } 2>&1 | tee .cache/m1/build.log
      - name: Check golden histories without network access
        shell: bash
        run: |
          set -euo pipefail
          while read -r fixture expected verdict; do
            for attempt in 1 2; do
              status=0
              sudo unshare --net -- env GOCOVERDIR="$GOCOVERDIR" .cache/bin/lab check "internal/evidence/testdata/$fixture" > ".cache/m1/$fixture-$attempt.json" 2> ".cache/m1/$fixture-$attempt.stderr" || status=$?
              printf '%s\n' "$status" > ".cache/m1/$fixture-$attempt.exit"
              test "$status" -eq "$expected"
            done
            cmp ".cache/m1/$fixture-1.json" ".cache/m1/$fixture-2.json"
            python3 - ".cache/m1/$fixture-1.json" "$verdict" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              result = json.load(stream)
          assert result["verdict"] == sys.argv[2], result
          assert result["release_qualified"] is False, result
          PY
          done <<'CASES'
          valid 0 PASS
          permitted-duplicate 0 PASS
          permitted-record 0 PASS
          corrupt-byte 1 VIOLATION
          required-loss 1 VIOLATION
          unsafe-prefix 1 VIOLATION
          aborted-leak 1 VIOLATION
          wrong-partition 1 VIOLATION
          missing-trigger 4 INCONCLUSIVE
          truncated-stream 2 HARNESS_ERROR
          incomplete-scan 4 INCONCLUSIVE
          indistinguishable-pass 0 PASS
          indistinguishable-loss 1 VIOLATION
          archive-unsupported 3 UNSUPPORTED
          unknown-contract 3 UNSUPPORTED
          changed-run 2 HARNESS_ERROR
          CASES
      - name: Reach and detect the faulty stand-in
        shell: bash
        run: |
          set -euo pipefail
          .cache/bin/lab calibrate .cache/m1/calibration > .cache/m1/calibration.json 2> .cache/m1/calibration.stderr
          python3 - <<'PY'
          import json
          with open(".cache/m1/calibration.json") as stream:
              outcomes = json.load(stream)
          assert [(o["mode"], o["result"]["verdict"]) for o in outcomes] == [
              ("healthy-pause", "PASS"), ("faulty", "VIOLATION")], outcomes
          assert all(o["result"]["namespace"] == "calibration" and
                     o["result"]["release_qualified"] is False for o in outcomes), outcomes
          PY
          for mode in healthy-pause faulty; do
            expected=0
            if [ "$mode" = faulty ]; then expected=1; fi
            for attempt in 1 2; do
              status=0
              sudo unshare --net -- env GOCOVERDIR="$GOCOVERDIR" .cache/bin/lab check ".cache/m1/calibration/$mode/bundle" > ".cache/m1/$mode-recheck-$attempt.json" 2> ".cache/m1/$mode-recheck-$attempt.stderr" || status=$?
              printf '%s\n' "$status" > ".cache/m1/$mode-recheck-$attempt.exit"
              test "$status" -eq "$expected"
            done
            cmp ".cache/m1/$mode-recheck-1.json" ".cache/m1/$mode-recheck-2.json"
          done
      - name: Verify the published artifact and observe its native version
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          .cache/bin/lab verify .cache/m1/release > .cache/m1/verify.json 2> .cache/m1/verify.stderr
          python3 - <<'PY'
          import json
          with open(".cache/m1/verify.json") as stream:
              result = json.load(stream)
          assert result["version_runtime"] == "native linux/amd64 host", result
          assert result["tag"] == "v0.6.0", result
          assert result["commit"] == "d7d485b96a52b711cb10d76dca09aa9b155dec5e", result
          PY
      - name: Inspect pinned release function metadata as data only
        env:
          LAB_SUBJECT_POINTS: "1"
          LAB_SUBJECT_POINTS_BINARY: ${{ github.workspace }}/.cache/m1/release/kaferry
        shell: bash
        run: |
          set -euo pipefail
          go test -v -covermode=atomic -coverpkg=./... -coverprofile=.cache/m1/subject-points-coverage.out -count=1 -timeout=2m ./internal/campaign -run '^TestPinnedReleaseSubjectPointMetadataDataOnly$' 2>&1 | tee .cache/m1/subject-points.log
      - name: Retain statement coverage from the actual M1 executions
        if: always()
        shell: bash
        run: |
          go tool covdata textfmt -i=.cache/m1/coverage -o=.cache/m1/coverage.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/m1/
          retention-days: 14
          if-no-files-found: error
  observer:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'normal' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      LAB_RUN_ID: m0-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Start two digest-pinned Kafka 3.9.2 clusters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/m0
          go run ./cmd/fixture up "$LAB_RUN_ID" | tee .cache/m0/fixture-up.log
      - name: Measure independent observer capabilities
        shell: bash
        run: |
          set -euo pipefail
          eval "$(go run ./cmd/fixture env "$LAB_RUN_ID")"
          go test -v -count=1 -timeout=4m ./internal/observer -run Live 2>&1 | tee .cache/m0/capabilities.log
      - name: Calibrate owned M2 broker controls and Kafka observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/m2
          eval "$(go run ./cmd/fixture env "$LAB_RUN_ID")"
          go test -v -covermode=atomic -coverpkg=./... -coverprofile=.cache/m2/live-coverage.out -count=1 -timeout=4m ./internal/campaign -run '^TestLiveM2ControllerCalibration$' 2>&1 | tee .cache/m2/controllers.log
      - name: Retain broker logs and clean owned resources
        if: always()
        shell: bash
        run: |
          mkdir -p .cache/m0
          for role in source dest; do
            docker logs "kaferry-lab-$LAB_RUN_ID-$role" > ".cache/m0/$role.log" 2>&1 || true
          done
          go run ./cmd/fixture down "$LAB_RUN_ID" 2>&1 | tee .cache/m0/cleanup.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m0-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/m0/
            .cache/m2/
            .cache/fixtures/
          retention-days: 14
          if-no-files-found: error
  m2-release:
    # These four existing narrow cases do not complete the remaining M2 mechanisms.
    if: ${{ github.repository == 'pagrus7/kaferry-lab' && github.repository_id == '1432555755' && github.event_name == 'push' && github.ref == 'refs/heads/codex/resilience-release-lab' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - scenario: healthy
            routing: PRESERVE
          - scenario: healthy
            routing: KEY
          - scenario: source-startup
            routing: PRESERVE
          - scenario: repeated-kill
            routing: PRESERVE
    env:
      LAB_RUN_ID: m2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}-${{ matrix.routing == 'KEY' && 'key' || 'preserve' }}
      GOCOVERDIR: ${{ github.workspace }}/.cache/m2-release/coverage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build the harness and create only this run's fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/bin .cache/m2-release/coverage
          {
            test "$(uname -sm)" = "Linux x86_64"
            go version
            go build -cover -coverpkg=./... -o .cache/bin/lab ./cmd/lab
            go version -m .cache/bin/lab > .cache/m2-release/build-info.log
            go run ./cmd/fixture up "$LAB_RUN_ID"
          } 2>&1 | tee .cache/m2-release/preparation.log
      - name: Run one bounded partial M2 release scenario
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          ROUTING: ${{ matrix.routing }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 - <<'PYWIRE'
          import json
          with open('.cache/m2-release/packet-status.json', 'x') as stream:
              json.dump({
                  'status': 'UNSUPPORTED',
                  'release_qualified': False,
                  'reason': 'Packet capture stopped after dumpcap could not open its output: Permission denied.',
                  'denied_run': 'https://github.com/pagrus7/kaferry-lab/actions/runs/40156040335',
                  'capture_attempted': False,
              }, stream, indent=2)
          PYWIRE
          .cache/bin/lab scenario "$LAB_RUN_ID" "$SCENARIO" "$ROUTING" .cache/m2-release/attempt > .cache/m2-release/result.json 2> .cache/m2-release/scenario.stderr || status=$?
          printf '%s\n' "$status" > .cache/m2-release/scenario.exit
          # A proved product violation is retained separately from harness failure.
          test "$status" -eq 0 -o "$status" -eq 1
          python3 - <<'PY'
          import json
          with open('.cache/m2-release/result.json') as stream:
              result = json.load(stream)['result']
          assert result['verdict'] in ('PASS', 'VIOLATION'), result
          assert result['release_qualified'] is False, result
          import os
          with open('.cache/m2-release/attempt/bundle/manifest.json') as stream:
              manifest = json.load(stream)
          assert manifest['lab_source']['commit'] == os.environ['GITHUB_SHA'], manifest['lab_source']
          assert manifest['lab_source']['dirty'] is False, manifest['lab_source']
          assert 'vcs.revision=' + os.environ['GITHUB_SHA'] in manifest['lab_source']['proof'], manifest['lab_source']
          PY
      - name: Independently recheck without Kafka, network or executable
        if: always() && hashFiles('.cache/m2-release/attempt/bundle/complete.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          expected=$(python3 - <<'PY'
          import json
          with open('.cache/m2-release/result.json') as stream:
              verdict = json.load(stream)['result']['verdict']
          print({'PASS': 0, 'VIOLATION': 1, 'HARNESS_ERROR': 2, 'UNSUPPORTED': 3, 'INCONCLUSIVE': 4}[verdict])
          PY
          )
          printf '%s\n' "$expected" > .cache/m2-release/recheck-expected.exit
          sha256sum .cache/m2-release/attempt/release/kaferry > .cache/m2-release/executed-binary.sha256
          rm .cache/m2-release/attempt/release/kaferry
          test ! -e .cache/m2-release/attempt/release/kaferry
          for attempt in 1 2; do
            status=0
            sudo unshare --net -- env GOCOVERDIR="$GOCOVERDIR" .cache/bin/lab check .cache/m2-release/attempt/bundle > ".cache/m2-release/recheck-$attempt.json" 2> ".cache/m2-release/recheck-$attempt.stderr" || status=$?
            printf '%s\n' "$status" > ".cache/m2-release/recheck-$attempt.exit"
            test "$status" -eq "$expected"
          done
          cmp .cache/m2-release/recheck-1.json .cache/m2-release/recheck-2.json
          python3 - <<'PY'
          import json
          with open('.cache/m2-release/result.json') as stream:
              runtime = json.load(stream)['result']
          with open('.cache/m2-release/recheck-1.json') as stream:
              offline = json.load(stream)
          assert runtime == offline, (runtime, offline)
          PY
      - name: Retain final coverage and clean this run's resources
        if: always()
        shell: bash
        run: |
          mkdir -p .cache/m2-release
          status=0
          go run ./cmd/fixture down "$LAB_RUN_ID" > .cache/m2-release/cleanup.log 2>&1 || status=$?
          printf '%s\n' "$status" > .cache/m2-release/cleanup.exit
          coverage_status=0
          go tool covdata textfmt -i="$GOCOVERDIR" -o=.cache/m2-release/coverage.out > .cache/m2-release/coverage.log 2>&1 || coverage_status=$?
          test "$status" -eq 0
          test "$coverage_status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-release-${{ matrix.scenario }}-${{ matrix.routing }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/m2-release/
            .cache/fixtures/
          retention-days: 14
          if-no-files-found: error

  links:
    if: ${{ github.repository == 'pagrus7/kaferry-lab' && github.event_name == 'push' && github.ref == 'refs/heads/codex/resilience-release-lab' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'normal') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LAB_RUN_ID: links-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Build fresh owned calibration executables and selected public metadata
        id: build
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -sm)" = 'Linux x86_64'
          test "$GITHUB_JOB" = links
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$LAB_RUN_ID" = "links-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 - <<'PYBUILD'
          import datetime, os, pathlib, re, stat
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['GITHUB_SHA'])
          assert re.fullmatch(r'links-[1-9][0-9]{0,19}-[1-9][0-9]{0,8}', os.environ['LAB_RUN_ID'])
          root = pathlib.Path('.cache')
          if not root.exists():
              root.mkdir(mode=0o700)
          info = root.lstat()
          assert stat.S_ISDIR(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o700
          for path in [root / 'links', root / 'link-calibration-build']:
              path.mkdir(mode=0o700)
          build = root / 'link-calibration-build' / os.environ['LAB_RUN_ID']
          build.mkdir(mode=0o700)
          timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='microseconds').replace('+00:00', 'Z')
          (build / 'BuiltAfterUTC').write_text(timestamp + '\n')
          PYBUILD
          build="$GITHUB_WORKSPACE/.cache/link-calibration-build/$LAB_RUN_ID"
          go build -buildvcs=true -o "$build/link-calibration" ./cmd/link-calibration
          go test -c -buildvcs=true -o "$build/campaign.test" ./internal/campaign
          chmod 0555 "$build/link-calibration" "$build/campaign.test"
          go version -m "$build/link-calibration" > "$build/driver-buildinfo.txt"
          go version -m "$build/campaign.test" > "$build/test-buildinfo.txt"
          python3 - <<'PYMETA'
          import hashlib, json, os, pathlib, stat
          build = pathlib.Path('.cache/link-calibration-build') / os.environ['LAB_RUN_ID']
          head = os.environ['GITHUB_SHA']
          records = {}
          for name, metadata, package in [('link-calibration', 'driver-buildinfo.txt', 'github.com/pagrus7/kaferry-lab/cmd/link-calibration'), ('campaign.test', 'test-buildinfo.txt', 'github.com/pagrus7/kaferry-lab/internal/campaign.test')]:
              path = build / name
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o555 and 0 < info.st_size <= 128 << 20
              text = (build / metadata).read_text()
              assert '\tpath\t' + package + '\n' in text
              for setting in ['GOOS=linux', 'GOARCH=amd64', 'vcs.revision=' + head, 'vcs.modified=false']:
                  assert '\tbuild\t' + setting + '\n' in text
              records[name] = {'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'bytes': info.st_size, 'mode': '0555', 'package': package, 'source_head': head, 'source_clean': True, 'goos': 'linux', 'goarch': 'amd64'}
          record = {'namespace': 'calibration/linked-build', 'run_id': os.environ['LAB_RUN_ID'], 'job': 'links', 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'source_head': head, 'built_after_utc': (build / 'BuiltAfterUTC').read_text().strip(), 'executables': records, 'release_qualified': False, 'runtime_requested': os.environ['LAB_LINK_RUNTIME'] == 'enabled'}
          with pathlib.Path('.cache/links/build.json').open('x') as stream:
              json.dump(record, stream, indent=2, sort_keys=True)
              stream.write('\n')
          PYMETA
      - name: Run the sole foreground driver which owns setup tests and cleanup
        id: driver
        if: ${{ env.LAB_LINK_RUNTIME == 'enabled' && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          build="$GITHUB_WORKSPACE/.cache/link-calibration-build/$LAB_RUN_ID"
          test_sha=$(python3 -c 'import json; print(json.load(open(".cache/links/build.json"))["executables"]["campaign.test"]["sha256"])')
          built_after=$(cat "$build/BuiltAfterUTC")
          status=0
          "$build/link-calibration" --repository "$GITHUB_WORKSPACE" --run-id "$LAB_RUN_ID" --test-binary "$build/campaign.test" --test-sha256 "$test_sha" --reviewed-head "$GITHUB_SHA" --built-after "$built_after" || status=$?
          # This file is written only after the actual foreground command returns.
          # Cancellation before this point leaves no fact and cannot authorize sealing.
          printf '%s\n' "$status" > .cache/links/foreground.exit
      - name: Admit typed writer closure independently of calibration outcome
        id: proof
        if: ${{ always() && !cancelled() && env.LAB_LINK_RUNTIME == 'enabled' && steps.driver.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        env:
          CALLER_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYPROOF'
          import json, os, pathlib, re, stat, sys
          def rejected():
              raise ValueError('caller-proof-rejected')
          def require(value):
              if not value:
                  rejected()
          def boolean(value):
              require(type(value) is bool)
              return value
          def integer(value, low=0, high=1 << 63):
              require(type(value) is int and low <= value <= high)
              return value
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result
          def receipt(path):
              info = path.lstat()
              require(stat.S_ISREG(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o600 and 0 < info.st_size <= 256 << 10)
              return json.loads(path.read_bytes(), object_pairs_hook=unique)
          try:
              require(os.environ['CALLER_CANCELLED'] == 'false')
              run, head = os.environ['LAB_RUN_ID'], os.environ['GITHUB_SHA']
              require(os.environ['GITHUB_JOB'] == 'links')
              require(run == 'links-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              require(re.fullmatch(r'[0-9a-f]{40}', head) is not None)
              foreground = pathlib.Path('.cache/links/foreground.exit').read_text()
              require(re.fullmatch(r'[0-9]{1,3}\n', foreground) is not None)
              code = integer(int(foreground), 0, 255)
              build = receipt(pathlib.Path('.cache/links/build.json'))
              require(build['source_head'] == head and build['run_id'] == run and build['job'] == 'links' and build['attempt'] == os.environ['GITHUB_RUN_ATTEMPT'])
              public = pathlib.Path('.cache/link-calibration') / run
              for parent in [pathlib.Path('.cache'), public.parent, public]:
                  info = parent.lstat()
                  require(stat.S_ISDIR(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o700)
              require(not (public / 'INCOMPLETE.json').exists() and not (public / 'result.pending.json').exists())
              r = receipt(public / 'WRITERS_QUIESCENT.json')
              require(r['Version'] == '1' and r['RunID'] == run and r['ReviewedHead'] == head and r['TestSHA256'] == build['executables']['campaign.test']['sha256'])
              require(boolean(r['Synthetic']) and not boolean(r['ReleaseQualified']))
              require(not boolean(r['SealingReady']) and not boolean(r['PublicationAuthorized']))
              require(boolean(r['WritersQuiescent']) and boolean(r['PrivateCaptureComplete']) and boolean(r['SetupReturned']))
              repository = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              driver_private = repository / '.cache/link-calibration-private' / run
              require(r['DriverPrivate'] == str(driver_private) and r['PrivateReference'] == str(driver_private / 'driver-errors.json'))
              require(r['FixturePrivate'] == str(repository / '.cache/fixtures-private' / (run + '-links')))
              attempted, returned = boolean(r['CleanupAttempted']), boolean(r['CleanupReturned'])
              require((attempted and returned) or (not attempted and not returned))
              w, tree = r['Wait'], r['Tree']
              require(boolean(tree['SubreaperEnabled']) and boolean(tree['Closed']) and boolean(tree['NoChildren']) and not boolean(tree['ControlFailed']))
              require(type(tree['Adopted']) is list or tree['Adopted'] is None)
              adopted = tree['Adopted'] or []
              require(len(adopted) <= 16)
              for child in adopted:
                  integer(child['PID'], 1)
                  status = integer(child['Status'], 0, (1 << 32) - 1)
                  require(boolean(child['Terminal']) and (os.WIFEXITED(status) or os.WIFSIGNALED(status)))
              if boolean(tree['AnchorStarted']):
                  integer(tree['AnchorPID'], 1)
                  require(re.fullmatch(r'[0-9]{1,32}', tree['AnchorStartTicks']) is not None)
                  require(boolean(tree['AnchorWaitReturned']) and boolean(tree['AnchorReaped']) and boolean(tree['SignalsClosed']))
                  status = integer(tree['AnchorStatus'], 0, (1 << 32) - 1)
                  require(os.WIFEXITED(status) or os.WIFSIGNALED(status))
              else:
                  require(not boolean(tree['AnchorWaitReturned']) and not boolean(tree['AnchorReaped']) and tree['AnchorPID'] == 0)
              if boolean(w['Started']):
                  integer(w['PID'], 1)
                  require(re.fullmatch(r'[0-9]{1,32}', w['StartTicks']) is not None)
                  require(boolean(w['WaitReturned']) and boolean(w['Reaped']) and boolean(w['StreamCopiesJoined']) and boolean(w['OutputComplete']))
                  integer(w['ExitCode'], -1, 255)
                  integer(w['SignalNumber'], 0, 64)
                  require((w['SignalNumber'] == 0 and w['ExitCode'] >= 0) or (w['SignalNumber'] > 0 and w['ExitCode'] == -1))
                  integer(w['WaitElapsedNS'], 1)
                  for channel in ['Stdout', 'Stderr']:
                      require(integer(w[channel + 'Bytes'], 0, 65536) == integer(w['Captured' + channel + 'Bytes'], 0, 65536))
                      require(integer(w['DroppedObserved' + channel + 'Bytes']) == 0)
              else:
                  require(not boolean(w['WaitReturned']) and not boolean(w['Reaped']) and not boolean(w['StreamCopiesJoined']) and w['PID'] == 0 and w['StartTicks'] == '')
              require(r['Status'] in ('INCOMPLETE', 'CALIBRATION_PASSED_NOT_QUALIFICATION'))
              passed = r['Status'] == 'CALIBRATION_PASSED_NOT_QUALIFICATION'
              require((code == 0) == passed)
              require(not passed or (boolean(w['TestsPassed']) and boolean(r['ResourcesCleaned']) and boolean(r['FixtureCleanupSucceeded']) and attempted and returned))
              selected = {'namespace': 'calibration/linked-caller', 'run_id': run, 'source_head': head, 'job': 'links', 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'foreground_return_observed': True, 'foreground_exit_code': code, 'caller_cancelled_at_admission': False, 'writers_quiescent': True, 'private_capture_complete': True, 'setup_returned': True, 'cleanup_attempted': attempted, 'cleanup_returned': returned, 'resources_cleaned': boolean(r['ResourcesCleaned']), 'fixture_cleanup_succeeded': boolean(r['FixtureCleanupSucceeded']), 'child_started': w['Started'], 'child_wait_returned': w['WaitReturned'], 'child_reaped': w['Reaped'], 'stream_copies_joined': w['StreamCopiesJoined'], 'anchor_started': tree['AnchorStarted'], 'anchor_wait_returned': tree['AnchorWaitReturned'], 'anchor_reaped': tree['AnchorReaped'], 'subreaper_enabled': True, 'terminal_adopted_waits': len(adopted), 'actual_ECHILD_observed_by_driver': True, 'calibration_passed': passed, 'release_qualified': False, 'scope': 'Reviewed driver final marker after actual wait/tree closure and primary sink sync/close; no ACK or Kaferry qualification.'}
              with pathlib.Path('.cache/links/caller-proof.json').open('x') as stream:
                  json.dump(selected, stream, indent=2, sort_keys=True)
                  stream.write('\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('writers_stopped=true\ncalibration_passed=' + str(passed).lower() + '\n')
          except Exception:
              print('linked caller proof rejected; sealing disabled', file=sys.stderr)
              sys.exit(1)
          PYPROOF
      - name: Seal only after actual stopped and reaped writer proof
        id: seal
        if: ${{ always() && !cancelled() && env.LAB_LINK_RUNTIME == 'enabled' && steps.proof.outcome == 'success' && steps.proof.outputs.writers_stopped == 'true' }}
        timeout-minutes: 1
        shell: bash
        env:
          CALLER_CANCELLED: ${{ job.status == 'cancelled' }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          WRITERS_STOPPED: ${{ steps.proof.outputs.writers_stopped }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/seal-link-notices.py --run-id "$LAB_RUN_ID" --source-head "$GITHUB_SHA" --recipient-sha256 ce023413c3cb69ca45f71d23a4fb6e6a5cabcea1b2feb4ae54f1e5452c74af57 --job links --attempt "$GITHUB_RUN_ATTEMPT" --layout linked-calibration-v2 --notice-writers-stopped-and-reaped
          # Admission is independent of the sealer's caller declaration. Only a
          # successful typed PYPROOF and exact bounded sealed files permit upload.
          python3 - <<'PYSEALED'
          import importlib.util, os, pathlib, re, sys
          sys.dont_write_bytecode = True
          helper, error_fd = None, None
          def require(value):
              if not value:
                  raise ValueError('encrypted-upload-admission-rejected')
          def exact(value, expected):
              require(type(value) is type(expected) and value == expected)
          def count(value, maximum):
              require(type(value) is int and 0 <= value <= maximum)
              return value
          try:
              spec = importlib.util.spec_from_file_location('notice_seal_admission', pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'scripts/seal-link-notices.py')
              helper = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(helper)
              run, head, attempt = os.environ['LAB_RUN_ID'], os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ATTEMPT']
              # An unavailable first sink cannot fall back to another location or public errors.
              _, error_fd = helper.reserve_operation(pathlib.Path('.cache/link-upload-private'), run)
              for key, value in {'CALLER_CANCELLED': 'false', 'PROOF_OUTCOME': 'success', 'WRITERS_STOPPED': 'true',
                                 'GITHUB_JOB': 'links', 'GITHUB_REPOSITORY': 'pagrus7/kaferry-lab',
                                 'GITHUB_REPOSITORY_ID': '1432555755', 'GITHUB_EVENT_NAME': 'push',
                                 'GITHUB_REF': 'refs/heads/codex/resilience-release-lab'}.items():
                  exact(os.environ[key], value)
              require(re.fullmatch(r'[1-9][0-9]{0,19}', os.environ['GITHUB_RUN_ID']) is not None)
              exact(run, 'links-' + os.environ['GITHUB_RUN_ID'] + '-' + attempt)
              identity = helper.identities(run, head, helper.CERT_PIN, 'links', attempt, helper.LINKED_LAYOUT)
              def receipt(path):
                  body = helper.read_regular(path, 256 << 10, private=True)
                  require(len(body) > 0)
                  return helper.parse_json(body), body
              root = pathlib.Path('.cache/link-quarantine') / run
              for directory in [pathlib.Path('.cache'), pathlib.Path('.cache/links'), root.parent, root]:
                  helper.check_private(directory.lstat(), True)
              require(set(p.name for p in root.iterdir()) == {'notice.cms', 'COMPLETE.json'})
              metadata, metadata_body = receipt(root / 'COMPLETE.json')
              cms = helper.read_regular(root / 'notice.cms', helper.MAX_CMS, private=True)
              require(0 < len(cms) <= helper.MAX_CMS)
              expected = dict(identity, complete=True, manifest_version=2, release_qualified=False,
                              publication='DISABLED; explicit encrypted-public-quarantine exception required',
                              cipher='AES-256-CBC; RSA-OAEP-SHA256; MGF1-SHA256; NOT AEAD',
                              completion_scope='captured bytes only; no writer-quiescence, cleanup or calibration qualification')
              require(type(metadata) is dict and set(metadata) == set(expected) | {'cms_bytes', 'cms_sha256', 'files', 'total_bytes', 'components', 'bundle_complete', 'caller_declaration', 'fixture_absence_sha256'})
              for key, value in expected.items():
                  exact(metadata[key], value)
              exact(metadata['cms_bytes'], len(cms))
              exact(metadata['cms_sha256'], helper.digest(cms))
              # Keep the sealer's legacy publication label exact. This trusted workflow
              # supplies the current encrypted-only authorization; the label grants none.
              declaration = metadata['caller_declaration']
              require(type(declaration) is dict and set(declaration) == {'notice_writers_stopped_and_reaped', 'observed_proof'})
              exact(declaration['notice_writers_stopped_and_reaped'], True)
              exact(declaration['observed_proof'], False)
              components = metadata['components']
              require(type(components) is dict and set(components) == {'driver', 'fixture'})
              for name, component in components.items():
                  require(type(component) is dict and set(component) == {'availability', 'files', 'total_bytes'})
                  require(component['availability'] in (('captured',) if name == 'driver' else ('captured', 'absent-ENOENT')))
                  count(component['files'], helper.MAX_FILES)
                  count(component['total_bytes'], helper.MAX_PAYLOAD)
                  if component['availability'] == 'captured':
                      require(component['files'] > 0 and component['total_bytes'] > 0)
                  else:
                      exact(component['files'], 0)
                      exact(component['total_bytes'], 0)
              exact(metadata['files'], sum(c['files'] for c in components.values()))
              count(metadata['files'], helper.MAX_FILES)
              exact(metadata['total_bytes'], sum(c['total_bytes'] for c in components.values()))
              count(metadata['total_bytes'], helper.MAX_PAYLOAD)
              absent = components['fixture']['availability'] == 'absent-ENOENT'
              exact(metadata['bundle_complete'], not absent)
              absence = metadata['fixture_absence_sha256']
              require((type(absence) is str and re.fullmatch(r'[0-9a-f]{64}', absence) is not None) if absent else absence is None)
              proof, proof_body = receipt(pathlib.Path('.cache/links/caller-proof.json'))
              fixed = {'namespace': 'calibration/linked-caller', 'run_id': run, 'source_head': head, 'job': 'links', 'attempt': attempt,
                       'foreground_return_observed': True, 'caller_cancelled_at_admission': False, 'writers_quiescent': True,
                       'private_capture_complete': True, 'setup_returned': True, 'subreaper_enabled': True,
                       'actual_ECHILD_observed_by_driver': True, 'release_qualified': False,
                       'scope': 'Reviewed driver final marker after actual wait/tree closure and primary sink sync/close; no ACK or Kaferry qualification.'}
              flags = {'cleanup_attempted', 'cleanup_returned', 'resources_cleaned', 'fixture_cleanup_succeeded', 'child_started',
                       'child_wait_returned', 'child_reaped', 'stream_copies_joined', 'anchor_started', 'anchor_wait_returned', 'anchor_reaped', 'calibration_passed'}
              require(type(proof) is dict and set(proof) == set(fixed) | flags | {'terminal_adopted_waits', 'foreground_exit_code'})
              for key, value in fixed.items():
                  exact(proof[key], value)
              for key in flags:
                  require(type(proof[key]) is bool)
              count(proof['terminal_adopted_waits'], 16)
              code = count(proof['foreground_exit_code'], 255)
              exact(helper.read_regular(pathlib.Path('.cache/links/foreground.exit'), 4, private=True), (str(code) + '\n').encode())
              exact(proof['calibration_passed'], code == 0)
              exact(proof['cleanup_attempted'], proof['cleanup_returned'])
              for prefix, suffixes in [('child', ['wait_returned', 'reaped']), ('anchor', ['wait_returned', 'reaped'])]:
                  for suffix in suffixes:
                      exact(proof[prefix + '_' + suffix], proof[prefix + '_started'])
              exact(proof['stream_copies_joined'], proof['child_started'])
              if proof['calibration_passed']:
                  require(all(proof[key] for key in ['resources_cleaned', 'fixture_cleanup_succeeded', 'cleanup_attempted']))
              public = pathlib.Path('.cache/link-calibration') / run
              require(not (public / 'INCOMPLETE.json').exists() and not (public / 'result.pending.json').exists())
              marker, _ = receipt(public / 'WRITERS_QUIESCENT.json')
              exact(marker['RunID'], run)
              exact(marker['ReviewedHead'], head)
              for key in ['WritersQuiescent', 'PrivateCaptureComplete', 'SetupReturned']:
                  exact(marker[key], True)
              for key in ['Closed', 'NoChildren', 'SubreaperEnabled']:
                  exact(marker['Tree'][key], True)
              exact(marker['Tree']['ControlFailed'], False)
              exact(marker['Status'], 'CALIBRATION_PASSED_NOT_QUALIFICATION' if code == 0 else 'INCOMPLETE')
              selected = dict(identity, namespace='calibration/encrypted-upload-admission', complete=True, cms_bytes=len(cms),
                              cms_sha256=helper.digest(cms), seal_complete_sha256=helper.digest(metadata_body),
                              caller_proof_sha256=helper.digest(proof_body), release_qualified=False)
              helper.write_private(pathlib.Path('.cache/links/seal-admission.json'), helper.encode(selected))
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('complete=true\n')
              owned, error_fd = error_fd, None
              helper.close_operation(owned)
          except BaseException as error:
              if error_fd is not None:
                  try:
                      helper.retain_os_error(error_fd, 'admit bounded encrypted diagnostic upload', error)
                  except BaseException:
                      pass
                  owned, error_fd = error_fd, None
                  try:
                      helper.close_operation(owned, error)
                  except BaseException:
                      pass
              try:
                  print('encrypted diagnostic admission rejected; upload disabled', file=sys.stderr, flush=True)
              except BaseException:
                  pass
              sys.exit(1)
          PYSEALED
      - name: Upload only the admitted diagnostic ciphertext
        id: encrypted_upload
        if: ${{ always() && !cancelled() && env.LAB_LINK_RUNTIME == 'enabled' && steps.proof.outcome == 'success' && steps.proof.outputs.writers_stopped == 'true' && steps.seal.outcome == 'success' && steps.seal.outputs.complete == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 2
        with:
          name: encrypted-link-notices-links-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/link-quarantine/${{ env.LAB_RUN_ID }}/notice.cms
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: false
      - name: Keep incomplete or failed calibration nonpassing after retention
        if: ${{ always() && env.LAB_LINK_RUNTIME == 'enabled' }}
        timeout-minutes: 1
        shell: bash
        env:
          PROOF_PASSED: ${{ steps.proof.outputs.calibration_passed }}
          SEALED: ${{ steps.seal.outputs.complete }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          SEAL_OUTCOME: ${{ steps.seal.outcome }}
          UPLOAD_OUTCOME: ${{ steps.encrypted_upload.outcome }}
          CALLER_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          test "$CALLER_CANCELLED" = false
          test "$PROOF_PASSED" = true
          test "$SEALED" = true
          test "$PROOF_OUTCOME" = success
          test "$SEAL_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
      - name: Upload only selected public build, caller and seal-admission facts
        if: ${{ always() && !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 1
        with:
          name: links-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/links/build.json
            .cache/links/caller-proof.json
            .cache/links/seal-admission.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: false
