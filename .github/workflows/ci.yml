name: Mac local retention calibration

on:
  push:
    branches:
      - codex/resilience-release-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaferry-lab-mac-local-retention
  cancel-in-progress: false

jobs:
  local-retention:
    # The operator-installed pre-job hook admits only reviewed source heads.
    # No pull-request code runs beside private evidence on this runner.
    if: ${{ github.repository == 'pagrus7/kaferry-lab' && github.repository_id == '1432555755' && github.ref == 'refs/heads/codex/resilience-release-lab' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: [kaferry-lab-mac-custody-20261025]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check installed retention code matches the reviewed checkout
        shell: bash
        run: |
          set -euo pipefail
          cmp scripts/mac-local-runner.py /Users/pg/services/kaferry-lab-mac-control-20261027/mac-local-runner.py
      - name: Retain and check fixed synthetic bytes on the Mac
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 /Users/pg/services/kaferry-lab-mac-control-20261027/mac-local-runner.py calibrate
      # Installed post-job hook checks only this fixed no-child calibration.
      # No artifact/cache upload, encryption, Go invocation or product run.
